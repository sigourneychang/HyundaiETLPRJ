# 로컬 Docker 테스트 환경(docker/docker-compose.yml)용 설정
# 이 프로그램은 대상(tgt) 클러스터에서 실행한다고 가정합니다.
# 운영 환경에서는 이 파일을 복사해서 명령어만 바꾸면 됩니다. 예)
#   beeline = beeline -u jdbc:hive2://원본HS2호스트:10000/ -n 사용자
#   hadoop  = hadoop

[src]
# 원본 Hive 접속 명령
beeline  = docker exec -i src-hiveserver2 timeout 900 /opt/hive/bin/beeline -u jdbc:hive2://localhost:10000/
# 대상 클러스터에서 원본 HDFS에 접근하는 주소 (distcp 원본 경로 앞에 붙음)
#   Hadoop 버전이 다르면 webhdfs://원본NN:50070 (Hadoop 2) / :9870 (Hadoop 3)
hdfs_uri = hdfs://src-namenode:8020
# 원본 hadoop 명령 (인벤토리에서 크기 조회용, 읽기 전용)
hadoop   = docker exec src-hiveserver2 timeout 600 hadoop

[tgt]
# 대상 Hive 접속 명령
beeline = docker exec -i tgt-hiveserver2 timeout 900 /opt/hive/bin/beeline -u jdbc:hive2://localhost:10000/
# 대상 hadoop 명령 (distcp도 이 명령으로 실행). 결과 TSV를 표준 입력으로 올리므로 docker exec 에 -i 필요
hadoop  = docker exec -i tgt-hiveserver2 hadoop
# 즉시 중지 시 YARN에 남은 distcp 작업을 종료할 yarn 명령. 이 줄이 없으면 hadoop 명령 기준으로 자동 설정
# (예: hadoop → yarn). 빈 값이면 사용 안 함. 로컬 Docker 환경은 YARN이 없어서 비워 둠
yarn    =

# ---------------------------------------------------------------------------
# 선택 설정: 아래는 기본값입니다. 바꿀 때만 주석(#)을 풀어서 쓰세요.
# ---------------------------------------------------------------------------
# [run]
# parallel  = 2        # 테이블·뷰를 동시에 처리할 수
# meta_batch = 50      # 준비 단계: beeline 한 세션에서 메타데이터를 읽을 테이블 수
# if_exists = resume   # 대상에 이미 있을 때: resume(같은 원본에서 OK로 옮긴 것은 건너뜀, 나머지는 다시 만듦)
#                      #   | replace(모두 지우고 다시 만듦) | skip(건너뜀) | fail(실패)
# validate  = auto     # 검증: auto(원본 크기별로 아래 셋 중 선택) | checksum(행 수 + 내용 해시, 양쪽 전체 스캔)
#                      #   | count(행 수만) | files(원본을 읽지 않고 파일 수·바이트 비교) | none
# checksum_max_bytes = 100G  # auto: 이보다 작으면 checksum
# count_max_bytes    = 1T    # auto: 이보다 작으면 count, 이상이면 files
# stats     = copy     # 통계: copy(원본 통계 복사) | analyze(대상에서 재계산) | none
# resume_min_bytes = 1T  # 이 크기 이상인 테이블은 실패해도 복사한 파일을 남기고 다음 실행(resume)에서 이어 복사
# repair_source = true # 파티션 테이블의 원본 행 수가 0이면 원본에서 MSCK REPAIR 후 다시 셈 (HDFS에만 있는 파티션 등록)
#                      #   정상 테이블은 메타스토어가 바뀌지 않음. 원본 메타스토어를 절대 건드리면 안 되면 false
#
# [distcp]
# options = -update -m 20     # -update 필수 (없으면 하위 폴더로 중첩 복사됨)
#                             # 원본 부하 제한: -bandwidth 매퍼당MB/s, -m 동시 매퍼 수
# timeout = 7200              # 시간 제한(초)의 하한. 실제는 원본 크기 / min_rate_mb MB/s x timeout_factor
# min_rate_mb = 100
# timeout_factor = 3
# maps_per_tb = 20            # 큰 테이블의 매퍼 수: 1TB당 이만큼 (options 의 -m 이 하한)
# max_maps = 200
#
# [result]
# db    = migration_meta      # 이관 결과 테이블 (대상 클러스터)
# table = migration_result
#
# [staging]
# db = zz_migration_stage     # ACID 테이블 이관용 임시 DB (양쪽 클러스터)
